name: stockflow

services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - vendor_data:/app/vendor
    environment:
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: "127.0.0.1:5173"
      SESSION_DOMAIN: "null"
      SESSION_SECURE_COOKIE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "composer install &&
      php artisan config:clear &&
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules_data:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -x node_modules/.bin/vite ] || ! sha256sum -c node_modules/.stockflow-deps.sha256 >/dev/null 2>&1; then
          npm ci
          sha256sum package.json package-lock.json > node_modules/.stockflow-deps.sha256
        fi
        exec npm run dev -- --host 0.0.0.0 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:
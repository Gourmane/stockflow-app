name: Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BACKEND_IMAGE: ghcr.io/gourmane/stockflow-backend
      FRONTEND_IMAGE: ghcr.io/gourmane/stockflow-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$BACKEND_IMAGE:sha-$GITHUB_SHA" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL=/api \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$FRONTEND_IMAGE:sha-$GITHUB_SHA" \
            ./frontend

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Push backend image
        run: docker push "$BACKEND_IMAGE:sha-$GITHUB_SHA"

      - name: Push frontend image
        run: docker push "$FRONTEND_IMAGE:sha-$GITHUB_SHA"